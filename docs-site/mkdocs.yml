# Set up as src's docs-site/mkdocs.yml, so the playbook looks like src's and
# freebsd-oci-containers' sites (PP-Q1, PP-Q13).
# The site is the repo itself, built in place: docs_dir is the repo root,
# one level up, since MkDocs refuses a docs_dir that holds its own config.
site_name: Production playbook
site_description: Architecture, processes, technical details and resources catalog of the agentic-workflows production project
docs_dir: ..
# No site_dir: MkDocs refuses one inside docs_dir. A build names its own with
# -d; serve builds into a temp dir.
# Added to MkDocs' default exclusions, `.*` and `/templates/`: .scratch/ is
# the only dot-directory with pages in the nav; docs-site/ holds this config,
# the nav file and the theme override, none of them pages.
exclude_docs: |
  !/.scratch/
  /docs-site/
# The infra pages imported from src at this commit (PP-Q7): the import
# command in the README reads it, and every imported page names it.
extra:
  src_commit: bd45974d1197d1e00a41f96ce3d7144530c7ae51
theme:
  name: material
  # Relative to this file: the note on imported pages.
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: grey
      accent: amber
      toggle:
        icon: material/lightbulb-auto-outline
        name: "Switch to light mode"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: amber
      toggle:
        icon: material/lightbulb
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: "Switch to system preference"
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  logo: docs/img/FreeBSD-colors.svg
  favicon: docs/img/favicon.ico
# Relative to docs_dir, the repo root.
extra_css:
  - docs/stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  # Snippet paths resolve from the repo root (docs_dir); a missing file fails
  # the build.
  - pymdownx.snippets:
      base_path: [!relative $docs_dir]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      title: Page contents
# Relative to this file: imported pages' links to src files the playbook
# lacks become plain text naming them in src (PP-Q19).
hooks:
  - hooks.py
# Naming any plugin drops MkDocs' default search, so it is listed here.
plugins:
  - search
  - literate-nav:
      nav_file: docs-site/nav.md
# MkDocs defaults omitted_files to info, and --strict fails only on warnings,
# so without this a page missing from the nav would pass the check.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
