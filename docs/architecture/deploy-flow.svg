  <text x="533.9" y="96.9" fill="#8b8b8b" text-anchor="middle">source rewritten</text>
  <text x="533.9" y="115.9" fill="#8b8b8b" text-anchor="middle">to 10.131.0.3</text>
  <path d="M813.8 40 H985.8 a8 8 0 0 1 8 8 V136 a8 8 0 0 1 -8 8 H813.8 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#142814" stroke="#486544"/>
