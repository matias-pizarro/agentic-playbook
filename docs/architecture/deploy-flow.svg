  <g font-size="12px">
  <text x="40" y="295.2" fill="#d9d9d9" text-anchor="start">Replies return over the network's default route via the bastion. The tunnel prod-agt-deploy is up</text>
  <text x="40" y="311.2" fill="#d9d9d9" text-anchor="start">only for a deploy; your laptop's peer 10.131.0.2 takes the same path from its own WireGuard.</text>
  <text x="40" y="327.2" fill="#d9d9d9" text-anchor="start">Boxes: plain grey = a process (the seat's script); laptop = a WireGuard peer outside the project;</text>
  <text x="40" y="343.2" fill="#d9d9d9" text-anchor="start">brick wall, orange = firewall, one row per rule; blue outline with a network sign = network; green</text>
  <text x="40" y="359.2" fill="#d9d9d9" text-anchor="start">with a monitor = server. Lines: thick blue dashed = WireGuard tunnel; solid = traffic, labelled</text>
  <text x="40" y="375.2" fill="#d9d9d9" text-anchor="start">protocol and port.</text>
  </g>
