  <text x="1186.2" y="96.9" fill="#8b8b8b" text-anchor="middle">10.130.1.n, ssh :22</text>
  <text x="1186.2" y="115.9" fill="#8b8b8b" text-anchor="middle">sees 10.131.0.3</text>
  <g font-size="12px">
  <text x="40" y="256.7" fill="#8b8b8b" text-anchor="start">Replies return over the network's default route via the bastion. No</text>
  <text x="40" y="272.7" fill="#8b8b8b" text-anchor="start">web port is open to the internet. The tunnel prod-agt-deploy is up</text>
  <text x="40" y="288.7" fill="#8b8b8b" text-anchor="start">only for a deploy; your laptop's peer 10.131.0.2 takes the same path</text>
  <text x="40" y="304.7" fill="#8b8b8b" text-anchor="start">from its own WireGuard.</text>
  </g>
