  <text x="1127.2" y="115.9" fill="#8b8b8b" text-anchor="middle">web UI on 127.0.0.1</text>
  <g font-size="12px">
  <text x="40" y="256.7" fill="#8b8b8b" text-anchor="start">A web UI: ssh -L 8080:localhost:&lt;port&gt; root@10.130.1.n through the</text>
  <text x="40" y="272.7" fill="#8b8b8b" text-anchor="start">same path, then http://localhost:8080 on the device. No web port is</text>
  <text x="40" y="288.7" fill="#8b8b8b" text-anchor="start">open to the internet. The tunnel agentic is up only for a deploy; your</text>
  <text x="40" y="304.7" fill="#8b8b8b" text-anchor="start">laptop's peer 10.131.0.2 takes the same path from its own WireGuard.</text>
  </g>
