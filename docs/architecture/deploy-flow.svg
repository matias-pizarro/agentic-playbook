  <g font-size="12px">
  <text x="40" y="309.2" fill="#d9d9d9" text-anchor="start">Replies return over the network's default route via the bastion. The tunnel prod-agt-deploy is up</text>
  <text x="40" y="325.2" fill="#d9d9d9" text-anchor="start">only for a deploy; your laptop's peer 10.131.0.2 takes the same path from its own WireGuard.</text>
  <text x="40" y="341.2" fill="#d9d9d9" text-anchor="start">Boxes: laptop = peer outside the project; brick wall, orange = firewall, one row per rule; blue</text>
  <text x="40" y="357.2" fill="#d9d9d9" text-anchor="start">outline with a network sign = network; green with a screen = server. Lines: thick blue dashed =</text>
  <text x="40" y="373.2" fill="#d9d9d9" text-anchor="start">WireGuard tunnel; solid = traffic, labelled protocol and port.</text>
