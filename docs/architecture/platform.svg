  <g font-size="12px">
  <text x="704" y="1087.7" fill="#d9d9d9" text-anchor="start">Boxes: brick wall, orange = firewall, one row per rule. Blue outline with a network sign = network</text>
  <text x="704" y="1103.7" fill="#d9d9d9" text-anchor="start">(a container: what is inside is on it). Green with a server rack = server or VM. Violet with a box =</text>
  <text x="704" y="1119.7" fill="#d9d9d9" text-anchor="start">jail, inside its server's network. Red with a hard drive = cloud disk. Laptop = a WireGuard peer</text>
  <text x="704" y="1135.7" fill="#d9d9d9" text-anchor="start">outside the project, each with its own tunnel. Folded page with a signpost = DNS zone. Circle = the</text>
  <text x="704" y="1151.7" fill="#d9d9d9" text-anchor="start">internet. Plain grey = cloud project.</text>
  <text x="704" y="1167.7" fill="#d9d9d9" text-anchor="start">Lines: thick blue dashed = WireGuard tunnel; solid = traffic, labelled protocol and port; dotted = a</text>
  <text x="704" y="1183.7" fill="#d9d9d9" text-anchor="start">disk attached.</text>
  </g>
